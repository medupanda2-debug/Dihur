name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: ZIP-i özü aç
        run: |
          ZIP=$(ls *.zip | head -n1)
          mkdir www
          unzip -q "$ZIP" -d www
          if [ ! -f www/index.html ]; then
            d=$(dirname "$(find www -name index.html | head -n1)")
            mv "$d"/* www/
          fi
          ls www

      - name: Capacitor + Android layihəsi
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init "Yuxu Taymeri" az.yuxu.taymeri --web-dir www
          npx cap add android
          npx cap sync android

      - name: İcazələr, ikon və alarm səsi
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, shutil, wave, struct, math
          from PIL import Image, ImageDraw
          res = 'android/app/src/main/res'

          # --- ikonlar ---
          full = Image.open('www/icons/icon-512.png').convert('RGBA')
          fg = Image.open('www/icons/icon-maskable-512.png').convert('RGBA')
          for d, legacy, adaptive in [('mdpi',48,108),('hdpi',72,162),('xhdpi',96,216),('xxhdpi',144,324),('xxxhdpi',192,432)]:
              p = f'{res}/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              full.resize((legacy, legacy), Image.LANCZOS).save(f'{p}/ic_launcher.png')
              r = full.resize((legacy, legacy), Image.LANCZOS)
              m = Image.new('L', (legacy, legacy), 0)
              ImageDraw.Draw(m).ellipse([0, 0, legacy-1, legacy-1], fill=255)
              o = Image.new('RGBA', (legacy, legacy), (0,0,0,0)); o.paste(r, (0,0), m)
              o.save(f'{p}/ic_launcher_round.png')
              fg.resize((adaptive, adaptive), Image.LANCZOS).save(f'{p}/ic_launcher_foreground.png')
          open(f'{res}/values/ic_launcher_background.xml', 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#0C1020</color></resources>\n')

          # --- alarm səsi: repo-da alarm.mp3/.wav/.ogg varsa onu, yoxsa standart siqnal ---
          raw = f'{res}/raw'
          os.makedirs(raw, exist_ok=True)
          user = [f for f in ('alarm.mp3', 'alarm.wav', 'alarm.ogg') if os.path.exists(f)]
          if user:
              shutil.copy(user[0], raw + '/alarm' + os.path.splitext(user[0])[1])
          else:
              sr = 22050
              w = wave.open(raw + '/alarm.wav', 'wb')
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              frames = bytearray()
              def tone(sec, f):
                  for i in range(int(sr*sec)):
                      env = min(1, i/200, (int(sr*sec)-i)/200)
                      frames.extend(struct.pack('<h', int(14000*env*math.sin(2*math.pi*f*i/sr))))
              def silence(sec):
                  frames.extend(b'\x00\x00' * int(sr*sec))
              for _ in range(10):
                  for _ in range(3):
                      tone(0.2, 880); silence(0.15)
                  silence(1.0)
              w.writeframes(bytes(frames)); w.close()
          PY
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: APK yığ
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Yuxu-Taymeri.apk

      - name: Release yarat (APK birbaşa yüklənir)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Yuxu Taymeri v${{ github.run_number }}
          files: Yuxu-Taymeri.apk
          
